- name: "Death Star Access Code"
  category: web
  value: 250
  type: standard
  description: |
    The panel you talked your way into can pull up personnel records by id,
    and it never checks whether the record is yours. Ask it for someone
    else's - someone who outranks you.
  flags:
    - "CTF{4DM1NCON7R0L}"
  tags: [level-2, hackwars]

# #10
- name: "Dark Holocron SQL Injection"
  category: web
  value: 350
  type: standard
  description: |
    Darth Vader's login form builds its query with string concatenation. A
    generic always-true payload gets you in as the first user in the table.
    The real admin account is named nowhere - but the login sends you onward
    addressed by whoever your query matched, so enumerate until its name
    surfaces, then target it.
  flags:
    - "CTF{4DM1NP4N3L}"
  tags: [level-3, hackwars]

