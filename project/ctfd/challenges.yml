# Reference manifest, ctfcli/CTFd challenge.yml shape (docs.ctfd.io/events).
# HackWars runs as one Flask app, not one container per challenge, so this
# file is not meant to be `ctf challenge sync`-ed as-is — it documents each
# in-app flag using CTFd's own schema, in case any is ever split out into a
# real standalone CTFd challenge. See ../CHALLENGES.md for the narrative
# version of this same mapping.
#
# Entry order below is historical and is NOT the ID order. Each entry carries
# its SOLUTIONS.md / CHALLENGES.md number in a comment - go by that (or by the
# flag string), never by position in this file.

